name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ONTOLOGY_DIR: ${{ github.workspace }}/ontology

jobs:
  # The Social Care layer and the conformance suite. The validation engine
  # itself is @theodi/data-standard-validator, tested in its own repo.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The examples live in SocialCareData/ontology, at the ref whose shapes
      # src/config.ts fetches.
      - uses: actions/checkout@v7
        with:
          repository: SocialCareData/ontology
          ref: main
          path: ontology
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Pinned expectations still match
        run: |
          npm run expectations
          git diff --exit-code test/expectations/

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The examples live in SocialCareData/ontology, at the ref whose shapes
      # src/config.ts fetches.
      - uses: actions/checkout@v7
        with:
          repository: SocialCareData/ontology
          ref: main
          path: ontology
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
