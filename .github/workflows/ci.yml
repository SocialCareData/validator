name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The conformance suite runs against the ontology repo's `main`, which moves
  # independently of this repo. A nightly run catches upstream drift before a
  # user does, and is what replaces the publish gate that used to live in
  # SocialCareData/standard.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The published package: src only, no web.
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # A published package that cannot be installed is worse than no package.
      - name: Install the tarball elsewhere and run it
        run: |
          tarball="$(npm pack --silent)"
          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$tarball"
          ./node_modules/.bin/scd-validate --help
          ./node_modules/.bin/scd-validate -p person:subject-of-care \
            "$GITHUB_WORKSPACE/examples/person/subject-of-care/valid-subject-of-care.jsonld"

  # The GitHub Pages app. Never shipped to npm.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck:web
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
